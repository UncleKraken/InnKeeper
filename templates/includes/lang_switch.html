{% load i18n %}{% get_current_language as LANG %}
<form method="post" action="{% url 'accounts:set_language' %}" class="lang-switch">{% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" name="language" value="sq" class="{% if LANG == 'sq' %}active{% endif %}" title="Shqip">SQ</button>
  <button type="submit" name="language" value="en" class="{% if LANG == 'en' %}active{% endif %}" title="English">EN</button>
</form>
