{% load static i18n %}<!doctype html>
<html><head><meta charset="utf-8"><title>QR · {{ outlet.name }}</title>
<link rel="stylesheet" href="{% static 'css/innkeeper.css' %}">
<style>@page { size: A4; margin: 10mm; } .qr-sheet { display:grid; grid-template-columns:1fr 1fr; gap:8mm; max-width:190mm; margin:0 auto; }
.qr-card { border:1px dashed #bbb; border-radius:8px; padding:6mm; text-align:center; background:#fff; break-inside:avoid; }
.qr-card svg { width:45mm; height:45mm; } .qr-card h3 { margin:0 0 2mm; } .qr-card p { margin:2mm 0 0; font-size:.8rem; color:#555; }</style>
</head><body style="background:#eceae6">
<div class="no-print receipt-actions"><a class="btn btn-secondary" href="{% url 'outlets:menu_admin' outlet.pk %}">{% translate "Back" %}</a><button class="btn" onclick="window.print()">{% translate "Print" %}</button></div>
<div class="qr-sheet">
  {% for c in cards %}<div class="qr-card"><h3>{{ outlet.name }}</h3>{{ qr }}<p>Skano për menunë · Scan for the menu</p></div>{% endfor %}
</div>
</body></html>
