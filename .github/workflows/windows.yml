name: windows-installer

# Builds InnKeeper-Setup-<version>.exe.
#  - On every push to v2/master: build and attach the installer to the run (Actions → this run → Artifacts).
#  - On a tag like v2.1.0, or when run by hand with a release tag: also publish it as a GitHub Release,
#    which the app's update notice points to.
on:
  push:
    branches: [master, main, v2]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v2.1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-windows.txt

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(python -c 'import apps; print(apps.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Collect static files
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: build-only
        run: python manage.py collectstatic --noinput -v0

      - name: Build app with PyInstaller
        run: pyinstaller windows/innkeeper.spec --noconfirm --distpath dist --workpath build

      - name: Self-test the built app
        shell: pwsh
        run: |
          $env:INNKEEPER_DATA_DIR = "$env:RUNNER_TEMP\innkeeper-selftest"
          $env:INNKEEPER_PORT = "8790"
          $p = Start-Process -FilePath "dist\InnKeeper\InnKeeper.exe" -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Host "Self-test timed out" }
          $log = "$env:INNKEEPER_DATA_DIR\logs\selftest.txt"
          if (Test-Path $log) {
            Get-Content $log
            # Also surface the output as annotations so it is visible without opening the full log.
            if ($p.ExitCode -ne 0) { $tail = (Get-Content $log | Select-Object -Last 12) -join "%0A"; Write-Host "::error title=selftest::$tail" }
          } else { Write-Host "::warning title=selftest::no selftest.txt was written" }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" windows\installer.iss

      - name: Test the installer (silent install, then start the installed app)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\installer\*.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$env:RUNNER_TEMP\InnKeeperInstalled" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "Installer timed out" }
          if ($p.ExitCode -ne 0) { throw "Installer failed with exit code $($p.ExitCode)" }
          $env:INNKEEPER_DATA_DIR = "$env:RUNNER_TEMP\innkeeper-installed-test"
          $env:INNKEEPER_PORT = "8791"
          $app = Start-Process -FilePath "$env:RUNNER_TEMP\InnKeeperInstalled\InnKeeper.exe" -ArgumentList "--selftest" -PassThru
          if (-not $app.WaitForExit(180000)) { $app.Kill(); throw "Installed app self-test timed out" }
          Get-Content "$env:INNKEEPER_DATA_DIR\logs\selftest.txt"
          if ($app.ExitCode -ne 0) { throw "Installed app self-test failed" }

      - name: Test the firewall rule (install for all users, then uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\installer\*.exe | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\InnKeeperAllUsers"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/ALLUSERS", "/DIR=$dir" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "Installer timed out" }
          if ($p.ExitCode -ne 0) { throw "Installer failed with exit code $($p.ExitCode)" }
          $rule = netsh advfirewall firewall show rule name=InnKeeper verbose | Out-String
          Write-Host $rule
          if ($rule -notmatch "InnKeeper\.exe") { throw "Firewall rule was not added" }
          if ($rule -notmatch "LocalSubnet") { throw "Firewall rule is not limited to the local network" }
          $u = Start-Process -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          if (-not $u.WaitForExit(300000)) { $u.Kill(); throw "Uninstaller timed out" }
          Start-Sleep -Seconds 5
          $left = netsh advfirewall firewall show rule name=InnKeeper | Out-String
          if ($left -match "InnKeeper\.exe") { throw "Firewall rule was left after uninstall" }

      - name: Screenshot of the InnKeeper window
        shell: pwsh
        continue-on-error: true
        run: |
          $env:INNKEEPER_DATA_DIR = "$env:RUNNER_TEMP\innkeeper-window-test"
          $env:INNKEEPER_PORT = "8792"
          $app = Start-Process -FilePath "$env:RUNNER_TEMP\InnKeeperInstalled\InnKeeper.exe" -PassThru
          Start-Sleep -Seconds 45
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $bmp.Save("screenshots\window.png")
          Get-Process InnKeeper -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content "$env:INNKEEPER_DATA_DIR\logs\*.log" -ErrorAction SilentlyContinue | Select-Object -Last 10

      - uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: window-screenshot
          path: screenshots/

      - uses: actions/upload-artifact@v7
        with:
          name: InnKeeper-Setup-${{ steps.version.outputs.version }}
          path: dist/installer/*.exe

  # Every release first passes the end-to-end test on Windows (launcher, Cloudflare Tunnel,
  # sign-in over a real public tunnel, tax authority test system probe).
  e2e:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    uses: ./.github/workflows/e2e-windows.yml

  # The full Linux test suite must pass too before anything is published.
  tests:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    uses: ./.github/workflows/tests.yml

  publish:
    needs: [build, e2e, tests]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: InnKeeper-Setup-${{ needs.build.outputs.version }}
          path: dist/installer

      - name: Release notes (latest changelog section)
        shell: python
        run: |
          import re
          text = open("CHANGELOG.md", encoding="utf-8").read()
          sections = re.split(r"(?m)^## ", text)
          open("release_notes.md", "w", encoding="utf-8").write("## " + sections[1].strip() + "\n")

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/installer/*.exe
          name: InnKeeper ${{ needs.build.outputs.version }}
          body_path: release_notes.md
