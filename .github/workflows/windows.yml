name: windows-installer

# Builds InnKeeper-Setup-<version>.exe.
#  - On every push to v2/master: build and attach the installer to the run (Actions → this run → Artifacts).
#  - On a tag like v2.1.0: also publish it as a GitHub Release, which the app's update notice points to.
on:
  push:
    branches: [v2, master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-windows.txt

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(python -c 'import apps; print(apps.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Collect static files
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: build-only
        run: python manage.py collectstatic --noinput -v0

      - name: Build app with PyInstaller
        run: pyinstaller windows/innkeeper.spec --noconfirm --distpath dist --workpath build

      - name: Self-test the built app
        shell: pwsh
        run: |
          $env:INNKEEPER_DATA_DIR = "$env:RUNNER_TEMP\innkeeper-selftest"
          $env:INNKEEPER_PORT = "8790"
          $p = Start-Process -FilePath "dist\InnKeeper\InnKeeper.exe" -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Host "Self-test timed out" }
          $log = "$env:INNKEEPER_DATA_DIR\logs\selftest.txt"
          if (Test-Path $log) {
            Get-Content $log
            # Also surface the output as annotations so it is visible without opening the full log.
            if ($p.ExitCode -ne 0) { $tail = (Get-Content $log | Select-Object -Last 12) -join "%0A"; Write-Host "::error title=selftest::$tail" }
          } else { Write-Host "::warning title=selftest::no selftest.txt was written" }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" windows\installer.iss

      - name: Test the installer (silent install, then start the installed app)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\installer\*.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$env:RUNNER_TEMP\InnKeeperInstalled" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "Installer timed out" }
          if ($p.ExitCode -ne 0) { throw "Installer failed with exit code $($p.ExitCode)" }
          $env:INNKEEPER_DATA_DIR = "$env:RUNNER_TEMP\innkeeper-installed-test"
          $env:INNKEEPER_PORT = "8791"
          $app = Start-Process -FilePath "$env:RUNNER_TEMP\InnKeeperInstalled\InnKeeper.exe" -ArgumentList "--selftest" -PassThru
          if (-not $app.WaitForExit(180000)) { $app.Kill(); throw "Installed app self-test timed out" }
          Get-Content "$env:INNKEEPER_DATA_DIR\logs\selftest.txt"
          if ($app.ExitCode -ne 0) { throw "Installed app self-test failed" }

      - uses: actions/upload-artifact@v7
        with:
          name: InnKeeper-Setup-${{ steps.version.outputs.version }}
          path: dist/installer/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/installer/*.exe
          name: InnKeeper ${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
